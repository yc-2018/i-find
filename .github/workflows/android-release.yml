name: 构建并发布 Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: 构建并发布 arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 准备 Release 签名文件
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::缺少 Android Release 签名 Secrets。"
            exit 1
          fi
          mkdir -p android/keystores
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystores/release.keystore

      - name: 构建 Release APK
        working-directory: native-android
        shell: bash
        env:
          IFIND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IFIND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IFIND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: 整理发布文件
        id: package
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' native-android/app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' native-android/app/build.gradle.kts | head -n 1)"
          SOURCE_APK="$(find native-android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*arm64-v8a*release*.apk' | head -n 1)"

          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" || -z "$SOURCE_APK" || ! -f "$SOURCE_APK" ]]; then
            echo "::error::无法读取版本号或找到 arm64-v8a Release APK。"
            exit 1
          fi

          TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}"
          ASSET_NAME="i-find-v${VERSION_NAME}-arm64-v8a.apk"
          RELEASE_NAME="I find v${VERSION_NAME} (${VERSION_CODE}) build ${GITHUB_RUN_NUMBER}"
          mkdir -p release
          cp "$SOURCE_APK" "release/$ASSET_NAME"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_path=release/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: 上传 Actions 构件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 30

      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          APK_PATH: ${{ steps.package.outputs.asset_path }}
          RELEASE_NAME: ${{ steps.package.outputs.release_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_NAME" --latest
          else
            gh release create "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --generate-notes \
              --latest
          fi
